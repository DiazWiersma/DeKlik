<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Klik – Waar de verbinding ontstaat</title>
<meta name="description" content="Netwerkevent op woensdag 16 december om 15.00 uur, georganiseerd door klas 2F. Maak kans op twee kaartjes voor Thuishaven!">
<meta name="theme-color" content="#fcf4e9">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_NL">
<meta property="og:title" content="De Klik – Waar de verbinding ontstaat">
<meta property="og:description" content="Netwerkevent op woensdag 16 december om 15.00 uur. Maak kans op twee kaartjes voor Thuishaven!">
<meta property="og:url" content="https://diazwiersma.github.io/DeKlik/">
<meta property="og:image" content="https://diazwiersma.github.io/DeKlik/logo.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcf4e9;--wine:#6b0f1f;--gold:#b8863b;--ink:#1a1214}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--wine)}
body{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  text-align:center;height:100dvh;
  padding:max(2.5dvh,env(safe-area-inset-top)) 6vw max(2dvh,env(safe-area-inset-bottom))}
p{font-size:clamp(17px,3dvh,26px);line-height:1.3;max-width:30em;text-wrap:balance}
.intro{display:flex;flex-direction:column;gap:1.2dvh}
.intro .gap{margin-top:1.4dvh}
strong{font-weight:700}
.logo{height:min(32dvh,80vw);width:auto;aspect-ratio:1;display:block}
.outro{font-size:clamp(18px,3.3dvh,28px)}
.bellwrap{display:flex;flex-direction:column;align-items:center;gap:.4dvh;
  background:none;border:0;cursor:pointer;color:var(--wine);font-family:inherit;-webkit-tap-highlight-color:transparent}
.bellwrap:focus-visible{outline:2px solid var(--wine);outline-offset:6px;border-radius:8px}
.bell{height:min(13dvh,28vw);width:auto;overflow:visible;display:block}
.hint{font-size:clamp(13px,2dvh,17px);font-weight:600;color:var(--wine);opacity:.75;letter-spacing:.04em}
.swing{transform-origin:50% 88%;transform-box:fill-box}
.wave{opacity:0;transform-origin:50% 50%}
.ring .swing{animation:swing 1.4s ease-out}
.ring .wave{animation:wave 1.4s ease-out}
.ring .w2{animation-delay:.12s}
@keyframes swing{0%,100%{transform:rotate(0)}12%{transform:rotate(-14deg)}28%{transform:rotate(11deg)}44%{transform:rotate(-7deg)}60%{transform:rotate(4deg)}78%{transform:rotate(-2deg)}}
@keyframes wave{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.fade{opacity:0;animation:in .8s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.9s}.d3{animation-delay:1.7s}
.d4{animation-delay:2.6s}.d5{animation-delay:3.4s}.d6{animation-delay:4s}
@media (prefers-reduced-motion:reduce){
  .fade{animation:none;opacity:1}.ring .swing,.ring .wave{animation:none}
}
</style>
<script data-goatcounter="https://fien.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main class="intro">
  <p class="fade d1">…Ja, zou jij wel eens willen weten waar dit nou over ging?</p>
  <p class="fade d2">Dat weet ik ook niet.</p>
  <p class="fade d3">Wat ik wel weet, is dat je op<br><strong>woensdag 16 december om 15.00 uur</strong><br>naar een netwerkevent kunt gaan, georganiseerd door klas 2F.</p>
</main>

<img class="logo fade d4" src="logo.jpg" width="1254" height="1254" alt="Logo van De Klik: twee silhouetten proosten met een glas. Waar de verbinding ontstaat.">

<footer style="display:flex;flex-direction:column;align-items:center;gap:1dvh">
  <p class="outro fade d5">Kom ernaartoe en maak kans op twee kaartjes voor Thuishaven!</p>
  <button class="bellwrap fade d6" id="bel" type="button" aria-label="Tik op de bel">
    <svg class="bell" viewBox="0 0 120 100" aria-hidden="true">
      <g class="wave w1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M92 14 q9 6 11 17"/><path d="M28 14 q-9 6 -11 17"/></g>
      <g class="wave w2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M100 4 q14 8 17 24"/><path d="M20 4 q-14 8 -17 24"/></g>
      <g class="swing" fill="currentColor">
        <rect x="53" y="10" width="14" height="7" rx="3.5"/>
        <rect x="57" y="16" width="6" height="8"/>
        <path d="M20 78 C20 46 38 26 60 26 S100 46 100 78 Z"/>
        <rect x="12" y="78" width="96" height="10" rx="5"/>
      </g>
      <path d="M34 66 C35 52 43 42 54 38" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="hint">Tik op de bel</span>
  </button>
</footer>

<script>
(function(){
  var btn=document.getElementById('bel'),ctx=null;
  function ding(){
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended')ctx.resume();
      var t=ctx.currentTime;
      [[1568,.5],[2350,.22],[3136,.14],[4180,.07]].forEach(function(p){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=p[0];
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(p[1],t+.005);
        g.gain.exponentialRampToValueAtTime(.0001,t+1.8);
        o.connect(g);g.connect(ctx.destination);
        o.start(t);o.stop(t+1.9);
      });
    }catch(e){}
  }
  function ring(){
    btn.classList.remove('ring');void btn.offsetWidth;btn.classList.add('ring');
  }
  btn.addEventListener('click',function(){ring();ding();});
  // Animatie speelt meteen bij laden (geluid kan pas na een tik).
  setTimeout(ring,4300);
})();
</script>
</body>
</html>
